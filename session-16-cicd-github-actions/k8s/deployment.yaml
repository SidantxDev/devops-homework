apiVersion: apps/v1
kind: Deployment
metadata:
  name: s16-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: s16-cicd-demo}
  template:
    metadata:
      labels: {app: s16-cicd-demo}
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER   # replaced by the CD pipeline with the exact image tag
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: s16-cicd-demo
spec:
  selector: {app: s16-cicd-demo}
  ports: [{port: 80, targetPort: 3000}]
