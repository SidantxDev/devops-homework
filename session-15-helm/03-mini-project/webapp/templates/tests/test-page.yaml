apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webapp.fullname" . }}-test
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -qO- http://{{ include "webapp.fullname" . }}:{{ .Values.service.port }} | grep "{{ .Values.page.title }}"
