# Init container must finish before the main container starts -> Init:0/1 -> PodInitializing -> Running
apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
spec:
  initContainers:
    - name: wait-a-bit
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Init: preparing...'; sleep 10; echo 'Init done'"]
  containers:
    - name: app
      image: nginx:1.27-alpine
