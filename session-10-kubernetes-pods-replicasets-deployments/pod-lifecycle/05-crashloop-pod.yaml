# Keeps failing with restartPolicy Always -> CrashLoopBackOff (Kubernetes retries with back-off)
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Starting...'; sleep 2; exit 1"]
