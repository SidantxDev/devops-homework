apiVersion: v1
kind: Service
metadata:
  name: shop-svc
spec:
  selector:
    app: app2          # FIX: matches the Pod label
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop2-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: shop2.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: shop-svc, port: {number: 80}}
