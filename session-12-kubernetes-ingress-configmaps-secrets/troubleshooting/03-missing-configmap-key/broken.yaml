apiVersion: v1
kind: Pod
metadata:
  name: cm-broken-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log_level      # BUG: the key is LOG_LEVEL (keys are case-sensitive)
