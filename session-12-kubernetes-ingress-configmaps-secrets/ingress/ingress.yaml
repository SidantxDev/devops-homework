apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  annotations:
    # /app1/anything -> /anything on the backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    # path-based routing on one host
    - host: demo.local
      http:
        paths:
          - path: /app1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: app1-svc, port: {number: 80}}
          - path: /app2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: app2-svc, port: {number: 80}}
---
# host-based routing: a different hostname per app
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: app1.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app1-svc, port: {number: 80}}
    - host: app2.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app2-svc, port: {number: 80}}
