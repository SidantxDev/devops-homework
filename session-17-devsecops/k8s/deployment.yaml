apiVersion: apps/v1
kind: Deployment
metadata:
  name: s17-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: s17-devsecops-demo}
  template:
    metadata:
      labels: {app: s17-devsecops-demo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot" user; a numeric UID is required with runAsNonRoot
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
          livenessProbe:
            httpGet: {path: /health, port: 3000}
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: s17-devsecops-demo
spec:
  selector: {app: s17-devsecops-demo}
  ports: [{port: 80, targetPort: 3000}]
