apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-api
spec:
  replicas: 1
  selector: {matchLabels: {app: metrics-api}}
  template:
    metadata: {labels: {app: metrics-api}}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-text=metrics-api OK", "-listen=127.0.0.1:5678"]   # BUG: loopback only - unreachable from other Pods
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-api
spec:
  selector: {app: metrics-api}
  ports: [{port: 80, targetPort: 5678}]
