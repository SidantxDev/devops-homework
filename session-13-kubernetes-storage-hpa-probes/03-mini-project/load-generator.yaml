apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-load
spec:
  replicas: 3
  selector:
    matchLabels: {app: web-load}
  template:
    metadata:
      labels: {app: web-load}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://resilient-web > /dev/null; done"]
