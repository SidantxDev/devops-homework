# hostPath: mounts a directory from the NODE's filesystem into the Pod
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written by $HOSTNAME at $(date)\" >> /host-data/hostpath.txt; sleep 3600"]
      volumeMounts:
        - {name: host-dir, mountPath: /host-data}
  volumes:
    - name: host-dir
      hostPath:
        path: /tmp/hostpath-demo
        type: DirectoryOrCreate
