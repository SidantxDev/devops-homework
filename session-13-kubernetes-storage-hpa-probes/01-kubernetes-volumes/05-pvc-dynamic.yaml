# Dynamic provisioning: only a PVC is written - the StorageClass creates the PV automatically
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  storageClassName: fast-local
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-pvc-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: dynamic-pvc-app}
  template:
    metadata:
      labels: {app: dynamic-pvc-app}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dynamic-pvc
