# Session 17 - CI/CD + DevSecOps pipeline
# Code → Build → Unit Test → SAST → SCA → Secret Scan → Docker Build → Image Scan → Security Gate → Push → Deploy
name: S21 Final Pipeline

on:
  push:
    branches: [master]
    paths:
      - "session-17-devsecops/**"
      - "!session-17-devsecops/**/*.md"
      - "!session-17-devsecops/screenshots/**"
      - ".github/workflows/s17-*.yml"
  workflow_dispatch:

env:
  APP_DIR: session-21-final-devops-project/final-devops-project
  IMAGE: ghcr.io/sidantxdev/final-devops-app

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: session-21-final-devops-project/final-devops-project/application}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Build (npm ci)
        run: npm ci
      - name: Unit tests
        run: npm test

  sast:
    name: SAST (Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan (registry rules + custom rules)
        run: |
          semgrep scan --metrics=off --error \
            --config p/javascript --config p/nodejs \
            --config $APP_DIR/security/semgrep-rules.yml \
            $APP_DIR/app/src

  sca:
    name: SCA (npm audit + Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: npm audit (fail on high)
        working-directory: session-21-final-devops-project/final-devops-project/application
        run: npm audit --audit-level=high
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: session-21-final-devops-project/final-devops-project/application
          trivy-config: session-21-final-devops-project/final-devops-project/security/trivy.yaml

  secret-scan:
    name: Secret Scan (gitleaks)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD/$APP_DIR:/src" zricethezav/gitleaks \
            dir /src --config /src/security/.gitleaks.toml --no-banner -v

  docker-build-scan:
    name: Docker Build + Image Scan (Trivy)
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t $IMAGE:${GITHUB_SHA::7} $APP_DIR
      - name: Trivy image scan (CRITICAL/HIGH, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD/$APP_DIR/security:/cfg \
            aquasec/trivy:latest image --config /cfg/trivy.yaml $IMAGE:${GITHUB_SHA::7}
      - name: Save image for the next job
        run: docker save $IMAGE:${GITHUB_SHA::7} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with: {name: image, path: image.tar.gz, retention-days: 1}

  security-gate:
    name: Security Gate
    needs: [build-test, sast, sca, secret-scan, docker-build-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks must pass
        run: |
          echo "build-test=${{ needs.build-test.result }} sast=${{ needs.sast.result }} sca=${{ needs.sca.result }} secret-scan=${{ needs.secret-scan.result }} image-scan=${{ needs.docker-build-scan.result }}"
          for r in ${{ needs.build-test.result }} ${{ needs.sast.result }} ${{ needs.sca.result }} ${{ needs.secret-scan.result }} ${{ needs.docker-build-scan.result }}; do
            [ "$r" = success ] || { echo "SECURITY GATE FAILED"; exit 1; }
          done
          echo "SECURITY GATE PASSED"

  push-image:
    name: Push Image (GHCR)
    needs: security-gate
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/download-artifact@v7
        with: {name: image}
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          docker tag $IMAGE:${GITHUB_SHA::7} $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Kubernetes
    needs: push-image
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: {cluster_name: s17}
      - name: Load image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE:${GITHUB_SHA::7}
          kind load docker-image $IMAGE:${GITHUB_SHA::7} --name s17
      - name: Deploy manifests
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE:${GITHUB_SHA::7}|" $APP_DIR/k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/final-devops-app --timeout=120s
          kubectl get pods -o wide
      - name: Smoke test
        run: |
          kubectl run smoke --image=curlimages/curl --restart=Never -- curl -fs http://final-devops-app/
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/smoke --timeout=60s
          kubectl logs smoke
