apiVersion: v1
kind: Namespace
metadata: {name: final}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: final}
data:
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "info"
---
# demo value only - real secrets come from CI / a secret manager, never from Git
apiVersion: v1
kind: Secret
metadata: {name: app-secret, namespace: final}
type: Opaque
stringData:
  API_TOKEN: "demo-not-a-real-token"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: app-data, namespace: final}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: final-app, namespace: final}
spec:
  replicas: 2
  selector: {matchLabels: {app: final-app}}
  template:
    metadata: {labels: {app: final-app}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: final-devops-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe: {httpGet: {path: /health, port: 3000}, failureThreshold: 10, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health, port: 3000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 3000}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: app-data}
---
apiVersion: v1
kind: Service
metadata: {name: final-app, namespace: final}
spec:
  selector: {app: final-app}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: final-app, namespace: final}
spec:
  ingressClassName: nginx
  rules:
    - host: final.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: final-app, port: {number: 80}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: final-app, namespace: final}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: final-app}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
